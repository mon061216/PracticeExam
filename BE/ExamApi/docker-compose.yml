version: '3.8'

services:
  db:
    image: postgres:15
    container_name: exam_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MyStrongPassword123@
      POSTGRES_DB: exam_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
